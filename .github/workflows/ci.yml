name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # llama-cpp-python has no Linux wheels and takes minutes to compile. The tests use a
      # fake model, so install the package without it and add only what the tests import.
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install numpy pandas pydantic pyyaml pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: Check relative links in the docs
        run: python scripts/check_links.py --offline
