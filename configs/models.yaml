# Model profiles. Pick one with: export LLAMA_PROFILE=<name>
# Fields: repo + file (Hugging Face GGUF), n_ctx (context window),
# n_gpu_layers (-1 = offload all layers to Metal/CUDA), n_threads (null = auto),
# mlx_repo (optional: the same model in MLX format, used for fine-tuning).
default: laptop-16gb

profiles:
  laptop-16gb:            # MacBook Pro 16GB: ~2 GB model file
    repo: bartowski/Llama-3.2-3B-Instruct-GGUF
    file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
    mlx_repo: mlx-community/Llama-3.2-3B-Instruct-4bit   # used by lesson 7 (fine-tuning)
    n_ctx: 4096
    n_gpu_layers: -1
    n_threads: null

  laptop-8b:              # Llama 3.1 8B: smarter than 3B, fits a 16 GB machine (4.9 GB file)
    repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
    file: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    mlx_repo: mlx-community/Meta-Llama-3.1-8B-Instruct-4bit
    n_ctx: 4096
    n_gpu_layers: -1
    n_threads: null

  studio-128gb:           # Mac Studio 128GB: ~43 GB model file
    repo: bartowski/Llama-3.3-70B-Instruct-GGUF
    file: Llama-3.3-70B-Instruct-Q4_K_M.gguf
    mlx_repo: mlx-community/Llama-3.3-70B-Instruct-4bit
    n_ctx: 8192
    n_gpu_layers: -1
    n_threads: null

  embedding:              # Small embedding model for the RAG lesson (~150 MB). Load with embedding=True.
    repo: nomic-ai/nomic-embed-text-v1.5-GGUF
    file: nomic-embed-text-v1.5.Q8_0.gguf
    n_ctx: 2048
    n_gpu_layers: -1
    n_threads: null
