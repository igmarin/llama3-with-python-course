[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-course"
version = "0.1.0"
description = "A small Python + LLM course using Llama models locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["llama-cpp-python", "huggingface-hub", "numpy", "pandas", "pyyaml"]

[project.optional-dependencies]
finetune = ["datasets", "trl", "transformers", "evaluate", "scikit-learn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a real GGUF model on disk (skipped otherwise)"]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["lessons"]
